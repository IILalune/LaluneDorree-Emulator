name: Feature request
description: Suggest an improvement to the emulator.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please check existing issues first. Suggestions are welcome, but implementation and timelines are not guaranteed.
        Requests for commercial ROMs, BIOS dumps, keys, or unauthorized download sources are not accepted.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the problem or use case this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you imagine it working in the app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds (optional)
      description: Have you tried another way to do this?
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Include relevant app settings, controller details, or examples. Remove personal information from attachments.
